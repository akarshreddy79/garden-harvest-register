<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Harvest Register • Sign In</title>
    <style>
        :root {
            font-family: Arial, Helvetica, sans-serif;
            color: #243126;
            background: #f4f7f2;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: radial-gradient(circle at 10% 20%, #e8f3ea 0%, #f4f7f2 90%);
        }

        .login-container {
            width: 100%;
            max-width: 440px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-logo {
            font-size: 3rem;
            margin-bottom: 8px;
            display: inline-block;
        }

        .brand-title {
            margin: 0 0 6px;
            color: #245b38;
            font-size: 1.75rem;
            font-weight: 700;
        }

        .brand-sub {
            margin: 0;
            color: #68756a;
            font-size: 0.95rem;
        }

        .login-card {
            background: #ffffff;
            border: 1px solid #e2e9e1;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(35, 65, 42, 0.08);
            padding: 32px 28px;
        }

        .card-heading {
            margin: 0 0 20px;
            font-size: 1.25rem;
            color: #2c5037;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: #3b4e3e;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            min-height: 44px;
            padding: 10px 14px;
            font-size: 0.95rem;
            border: 1px solid #ccd8cc;
            border-radius: 8px;
            background: #fff;
            color: #243126;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-input:focus {
            border-color: #3f8f55;
            box-shadow: 0 0 0 3px rgba(63, 143, 85, 0.15);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #68756a;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px;
        }

        .password-toggle:hover {
            color: #245b38;
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.86rem;
            color: #556657;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            accent-color: #245b38;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            min-height: 46px;
            background: #28713b;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background: #1f5a2e;
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .btn-guest {
            width: 100%;
            min-height: 40px;
            margin-top: 10px;
            background: #edf5ee;
            color: #28713b;
            border: 1px solid #bdd0bc;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-guest:hover {
            background: #e2ede3;
            border-color: #93b796;
        }

        .demo-box {
            margin-top: 22px;
            padding: 14px 16px;
            background: #f4f8f3;
            border: 1px dashed #bdd0bc;
            border-radius: 8px;
            font-size: 0.84rem;
            color: #3b4e3e;
        }

        .demo-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: 700;
            color: #28713b;
        }

        .demo-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-quick-fill {
            flex: 1;
            background: #ffffff;
            border: 1px solid #bdd0bc;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #28713b;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-quick-fill:hover {
            background: #e4f4e8;
            border-color: #8bbd91;
        }

        footer {
            text-align: center;
            margin-top: 24px;
            color: #7b887d;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <header class="brand-header">
            <div class="brand-logo">🌱</div>
            <h1 class="brand-title">Garden Harvest Register</h1>
            <p class="brand-sub">Daily yield logging & community garden management</p>
        </header>

        <main class="login-card">
            <h2 class="card-heading">Sign In to Dashboard</h2>

            <form id="loginForm" autocomplete="off">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-wrapper">
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-input"
                            value="admin"
                            placeholder="Enter username"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-input"
                            value="garden2026"
                            placeholder="Enter password"
                            required
                        >
                        <button type="button" id="togglePasswordBtn" class="password-toggle" aria-label="Toggle password visibility">
                            Show
                        </button>
                    </div>
                </div>

                <div class="form-row">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" checked>
                        <span>Remember my login</span>
                    </label>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">Sign In to Dashboard</button>
                <a href="project.html" class="btn-guest">Continue as Guest (Preview)</a>
            </form>

            <div class="demo-box">
                <div class="demo-box-header">
                    <span>Quick One-Click Sign In:</span>
                </div>
                <div class="demo-actions">
                    <button type="button" class="btn-quick-fill" id="fillAdminBtn">👤 Login as Admin</button>
                    <button type="button" class="btn-quick-fill" id="fillAkarshBtn">👤 Login as Akarsh</button>
                </div>
            </div>
        </main>

        <footer>
            Garden Harvest Register • Secure Access
        </footer>
    </div>

    <script>
        const PRESETS = {
            admin: { username: "admin", password: "garden2026", displayName: "Administrator", role: "Garden Manager" },
            akarsh: { username: "akarsh", password: "harvest123", displayName: "Akarsh Reddy", role: "Lead Harvester" }
        };

        const loginForm = document.getElementById("loginForm");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const rememberMeInput = document.getElementById("rememberMe");
        const togglePasswordBtn = document.getElementById("togglePasswordBtn");
        const fillAdminBtn = document.getElementById("fillAdminBtn");
        const fillAkarshBtn = document.getElementById("fillAkarshBtn");

        // Toggle password show/hide
        togglePasswordBtn.addEventListener("click", () => {
            const isPassword = passwordInput.getAttribute("type") === "password";
            passwordInput.setAttribute("type", isPassword ? "text" : "password");
            togglePasswordBtn.textContent = isPassword ? "Hide" : "Show";
        });

        function performLogin(displayName, role) {
            const username = usernameInput.value.trim() || "User";
            const sessionData = {
                username: username,
                displayName: displayName || (username.charAt(0).toUpperCase() + username.slice(1)),
                role: role || "Harvester",
                loginTime: new Date().toISOString()
            };

            try {
                sessionStorage.setItem("garden_user", JSON.stringify(sessionData));
                if (rememberMeInput && rememberMeInput.checked) {
                    localStorage.setItem("garden_user", JSON.stringify(sessionData));
                }
            } catch (err) {
                console.warn("Storage warning:", err);
            }

            window.location.href = "project.html";
        }

        fillAdminBtn.addEventListener("click", () => {
            usernameInput.value = PRESETS.admin.username;
            passwordInput.value = PRESETS.admin.password;
            performLogin(PRESETS.admin.displayName, PRESETS.admin.role);
        });

        fillAkarshBtn.addEventListener("click", () => {
            usernameInput.value = PRESETS.akarsh.username;
            passwordInput.value = PRESETS.akarsh.password;
            performLogin(PRESETS.akarsh.displayName, PRESETS.akarsh.role);
        });

        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const u = usernameInput.value.trim().toLowerCase();
            if (PRESETS[u]) {
                performLogin(PRESETS[u].displayName, PRESETS[u].role);
            } else {
                performLogin(null, "Harvester");
            }
        });
    </script>
</body>
</html>
